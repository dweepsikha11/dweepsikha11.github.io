baseURL = 'https://kahani-tale/'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
languageCode = "en"
title = 'Kahani Tale'
theme = 'lightbi-hugo'
summaryLength  = "30"
metaDataFormat = "yaml"
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClassic = true
pygmentOptions = "linenos=inline"
#googleAnalytics = "XXX"
enableRobotsTXT = true
enableGitInfo = false
ignoreLogs = ['warning-goldmark-raw-html']


[Params]
selfHosted = true
mainSections = ["posts"]
dateFormat = "02 January 2006"
comments = false
readingTime = false
wordCount = false
hideAuthor = false
useHLJS = true
delayDisqus = true
showRelatedPosts = true 
gcse = false
Lastmod = false
rss = true 
pagination = "10"
description="Your can add your website description here."
lunrSearch = true
previewCardImagePlacement = "bottom"
hidePostImage = false
tagSubtitle = "Here, you’ll discover the latest notes that explore new insights, and unique perspectives on the world."
homepageLayout = "profile" #blog
profileWelcomeHeading = "Hi I'm Dweepsikha"
profileWelcomeSubHeading = "Welcome to my space of stories and reflections 🌸"
profileShortbio = "I am a seeker at heart, deeply moved by the power of words, poetry, and the many mediums through which life could be experienced. This blog is my canvas, where I share fragments of my journey: verses, and reflections shaped by both my creative pursuits and my search for something profound. "
profilePhoto = "img/profile/home-profile-pic.jpg"

[pagination]
pagerSize = 9

[Params.Author]
  name = "Dweepsikha Banerjee"
  authorInfo = "Stories, verses, and visions of a searching soul."


[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2

[[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 3

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6

[caches]
  [caches.images]
    dir = ':cacheDir/images'